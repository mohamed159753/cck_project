<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <h2>Register</h2>
      <form  (ngSubmit)="onSubmit()" #registerForm="ngForm">
        <div class="input-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" [(ngModel)]="username" placeholder="Enter your username" required>
        </div>
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Enter your email" required>
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="Enter your password" required>
        </div>
        <button type="submit">Register</button>
      </form>
      <div class="register-link">
        Already have an account? <a href="#">Login here</a>
      </div>
    </div>
  </div>
</body>
</html>
